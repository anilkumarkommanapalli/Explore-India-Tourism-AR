<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Confirmed | Explore India</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="account-page">

<div class="booking-card glass confirmation">
    <div class="success-circle">✓</div>
    <h1>Booking Confirmed!</h1>
    <p>Your trip has been successfully booked.</p>

    <div class="confirmation-details">
        <p><span>Name</span><strong id="cName">-</strong></p>
        <p><span>Email</span><strong id="cEmail">-</strong></p>
        <p><span>Phone</span><strong id="cPhone">-</strong></p>
        <p><span>Destination</span><strong id="cDestination">-</strong></p>
        <p><span>Package</span><strong id="cPackage">-</strong></p>
        <p><span>Date</span><strong id="cDate">-</strong></p>
        <p><span>Travelers</span><strong id="cTravelers">-</strong></p>
        <p><span>Amount</span><strong id="cAmount">₹0</strong></p>
    </div>

    <a class="primary-button full" href="index.html">🏠 Back to Home</a>
</div>

<script src="js/script.js"></script>
</body>
</html>
